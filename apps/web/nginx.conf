server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  # Presigned MinIO/S3 transfers may use an operator-selected HTTPS origin.
  # Scripts, frames, forms, fonts, and rendered images remain self-contained.
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https:" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /version {
    return 404;
  }

  location ~ ^/(api|mcp|health|s)(?:/|$) {
    return 404;
  }

  location ~ ^/\.well-known(?:/|$) {
    return 404;
  }

  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  location /relay/ {
    expires 1y;
    try_files $uri =404;
  }

  location = /index.html {
    expires -1;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

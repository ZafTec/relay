<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 384" width="600" height="384" fill="none" role="img"><style>@media(prefers-color-scheme:dark){[fill="#E9E7DC"]{fill:#171919}[stroke="#E9E7DC"]{stroke:#171919}[fill="#F5F4ED"]{fill:#0F1010}[stroke="#F5F4ED"]{stroke:#0F1010}[fill="#EFEDE2"]{fill:#171919}[stroke="#EFEDE2"]{stroke:#171919}[fill="#D8D5C8"]{fill:#2B2E2E}[stroke="#D8D5C8"]{stroke:#2B2E2E}[fill="#C9C7BA"]{fill:#484C4C}[stroke="#C9C7BA"]{stroke:#484C4C}[fill="#141A16"]{fill:#EDEEEE}[stroke="#141A16"]{stroke:#EDEEEE}[fill="#46514B"]{fill:#B7BDBD}[stroke="#46514B"]{stroke:#B7BDBD}[fill="#5F6B64"]{fill:#929B9B}[stroke="#5F6B64"]{stroke:#929B9B}[fill="#7A8C84"]{fill:#929B9B}[stroke="#7A8C84"]{stroke:#929B9B}[fill="#1F776E"]{fill:#63C8BC}[stroke="#1F776E"]{stroke:#63C8BC}}</style><title>Three failure classes route differently: pre-submission failures retry free, confirmed submissions with failed retrieval are reconciled rather than resubmitted, and deterministic schema, safety or policy failures never retry</title><rect width="600" height="384" fill="#F5F4ED"></rect><text x="24" y="36" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="13" font-weight="700" letter-spacing="0.16em" fill="#141A16" text-anchor="start">RETRY DECISION</text><rect x="24" y="72" width="220" height="64" fill="#F5F4ED" stroke="#46514B" stroke-width="1"></rect><text x="40" y="100" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" letter-spacing="0.08em" fill="#141A16" text-anchor="start">ATTEMPT FAILS</text><text x="40" y="120" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="400" letter-spacing="0.02em" fill="#7A8C84" text-anchor="start">before provider submission</text><path d="M244 104H320" stroke="#1F776E" stroke-width="2"></path><rect x="320" y="72" width="240" height="64" fill="#E9E7DC" stroke="#46514B" stroke-width="1"></rect><path d="M320 72.5H560" stroke="#1F776E" stroke-width="3"></path><text x="336" y="100" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" letter-spacing="0.08em" fill="#141A16" text-anchor="start">RETRY</text><text x="336" y="120" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="400" letter-spacing="0.02em" fill="#7A8C84" text-anchor="start">transient · no charge</text><rect x="24" y="168" width="220" height="64" fill="#F5F4ED" stroke="#46514B" stroke-width="1"></rect><text x="40" y="196" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" letter-spacing="0.08em" fill="#141A16" text-anchor="start">SUBMITTED, CONFIRMED</text><text x="40" y="216" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="400" letter-spacing="0.02em" fill="#7A8C84" text-anchor="start">result retrieval fails</text><path d="M244 200H320" stroke="#46514B" stroke-width="1" stroke-dasharray="4 4"></path><rect x="320" y="168" width="240" height="64" fill="#F5F4ED" stroke="#46514B" stroke-width="1"></rect><text x="336" y="196" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" letter-spacing="0.08em" fill="#141A16" text-anchor="start">RECONCILE</text><text x="336" y="216" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="400" letter-spacing="0.02em" fill="#7A8C84" text-anchor="start">re-check provider, do not resubmit</text><rect x="24" y="264" width="220" height="64" fill="#F5F4ED" stroke="#46514B" stroke-width="1"></rect><text x="40" y="292" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" letter-spacing="0.08em" fill="#141A16" text-anchor="start">SCHEMA / SAFETY / POLICY</text><text x="40" y="312" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="400" letter-spacing="0.02em" fill="#7A8C84" text-anchor="start">deterministic rejection</text><path d="M244 296H320" stroke="#141A16" stroke-width="1" stroke-dasharray="2 4"></path><rect x="320" y="264" width="240" height="64" fill="#F5F4ED" stroke="#46514B" stroke-width="1"></rect><rect x="320" y="264" width="240" height="3" fill="#141A16"></rect><text x="336" y="292" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" letter-spacing="0.08em" fill="#141A16" text-anchor="start">NO RETRY</text><text x="336" y="312" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="400" letter-spacing="0.02em" fill="#7A8C84" text-anchor="start">fix input and run again</text><text x="24" y="364" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="400" letter-spacing="0.12em" fill="#46514B" text-anchor="start">CERTAINTY OF PROVIDER SUBMISSION DETERMINES THE PATH · AMBIGUOUS SUBMISSIONS ARE NEVER BLINDLY RESUBMITTED</text></svg>
name: relay

x-backend-image: &backend-image
  image: "${DOCKERHUB_NAMESPACE:-zaftec}/${DOCKERHUB_BACKEND_REPOSITORY:-relay-backend}@${BACKEND_DIGEST:?set BACKEND_DIGEST in the selected release file}"
  pull_policy: always
  read_only: true
  init: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=64m,mode=1777

x-runtime-environment: &runtime-environment
  APP_ENV: "production"
  APP_VERSION: "${RELEASE_VERSION:?set RELEASE_VERSION in the selected release file}"
  GIT_SHA: "${RELEASE_GIT_SHA:?set RELEASE_GIT_SHA in the selected release file}"
  DEPLOYMENT_ENVIRONMENT_NAME: "${DEPLOYMENT_ENVIRONMENT_NAME:-production}"
  OTEL_DENO: "${OTEL_DENO:-true}"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4318}"
  OTEL_PROPAGATORS: "tracecontext"
  OTEL_DENO_CONSOLE: "capture"
  OTEL_METRIC_EXPORT_INTERVAL: "${OTEL_METRIC_EXPORT_INTERVAL:-15000}"
  OTEL_TRACES_SAMPLER: "${OTEL_TRACES_SAMPLER:-always_on}"

services:
  api:
    <<: *backend-image
    command: ["api"]
    env_file:
      - path: "${API_ENV_FILE:-./env/api.env}"
        required: true
    environment:
      <<: *runtime-environment
      PORT: "8000"
      RELAY_PROCESS_ROLE: api
      OTEL_SERVICE_NAME: relay-api
    expose:
      - "8000"
    networks:
      edge:
        aliases:
          - relay-api
      data:
      telemetry:
    restart: unless-stopped
    stop_grace_period: 30s

  worker:
    <<: *backend-image
    command: ["worker"]
    env_file:
      - path: "${WORKER_ENV_FILE:-./env/worker.env}"
        required: true
    environment:
      <<: *runtime-environment
      RELAY_PROCESS_ROLE: worker
      OTEL_SERVICE_NAME: relay-worker
    networks:
      data:
      telemetry:
    restart: unless-stopped
    stop_grace_period: 2m

  migrate:
    <<: *backend-image
    command: ["migrate", "up"]
    env_file:
      - path: "${MIGRATE_ENV_FILE:-./env/migrate.env}"
        required: true
    environment:
      APP_VERSION: "${RELEASE_VERSION:?set RELEASE_VERSION in the selected release file}"
      GIT_SHA: "${RELEASE_GIT_SHA:?set RELEASE_GIT_SHA in the selected release file}"
      OTEL_DENO: "false"
    healthcheck:
      disable: true
    networks:
      data:
    profiles:
      - tools
    restart: "no"

  web:
    image: "${DOCKERHUB_NAMESPACE:-zaftec}/${DOCKERHUB_WEB_REPOSITORY:-relay-web}@${WEB_DIGEST:?set WEB_DIGEST in the selected release file}"
    pull_policy: always
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=0755
    expose:
      - "8080"
    networks:
      edge:
        aliases:
          - relay-web
    restart: unless-stopped
    stop_grace_period: 30s

networks:
  edge:
    external: true
    name: "${RELAY_EDGE_NETWORK:?set RELAY_EDGE_NETWORK in the selected release file}"
  data:
    external: true
    name: "${RELAY_DATA_NETWORK:?set RELAY_DATA_NETWORK in the selected release file}"
  telemetry:
    external: true
    name: "${RELAY_TELEMETRY_NETWORK:?set RELAY_TELEMETRY_NETWORK in the selected release file}"

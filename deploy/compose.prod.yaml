version: "3.8"

# Install as /opt/relay/docker-compose.yml alongside the production .env.
# Run deploy after the matching backend and web release has finished publishing.
services:
  relay-migrate:
    image: &backend-image zaftec/relay-backend:latest
    container_name: relay-migrate
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: ${MIGRATOR_DATABASE_URL:?set MIGRATOR_DATABASE_URL in .env}
      DATABASE_STATEMENT_TIMEOUT_MS: "600000"
      OTEL_DENO: "false"
    command: ["migrate", "up"]
    healthcheck:
      disable: true
    networks:
      - postgresql-db-n8n

  relay-api:
    image: *backend-image
    container_name: relay-api
    restart: unless-stopped
    env_file: .env
    environment:
      RELAY_PROCESS_ROLE: api
      OTEL_SERVICE_NAME: relay-api
    command: ["api"]
    depends_on:
      relay-migrate:
        condition: service_completed_successfully
    networks:
      - proxy-net
      - postgresql-db-n8n

  relay-worker:
    image: *backend-image
    container_name: relay-worker
    restart: unless-stopped
    env_file: .env
    environment:
      RELAY_PROCESS_ROLE: worker
      OTEL_SERVICE_NAME: relay-worker
      S3_ACCESS_KEY_ID: ${S3_WORKER_ACCESS_KEY_ID:?set S3_WORKER_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_WORKER_SECRET_ACCESS_KEY:?set S3_WORKER_SECRET_ACCESS_KEY in .env}
    command: ["worker"]
    depends_on:
      relay-migrate:
        condition: service_completed_successfully
    stop_grace_period: 2m
    networks:
      - proxy-net
      - postgresql-db-n8n

  relay-web:
    image: zaftec/relay-web:latest
    container_name: relay-web
    restart: unless-stopped
    depends_on:
      relay-api:
        condition: service_healthy
    networks:
      - proxy-net

networks:
  proxy-net:
    external: true
  postgresql-db-n8n:
    external: true

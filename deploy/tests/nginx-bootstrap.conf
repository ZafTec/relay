# Minimal harness for validating Relay snippets without relay-api/relay-web DNS.
pid /tmp/nginx.pid;
error_log stderr notice;

events {}

http {
  include /etc/nginx/mime.types;
  include /etc/nginx/relay-log-format.conf;

  server {
    listen 8080;
    server_name relay.example.test;
    include /etc/nginx/relay-routes.conf;
  }
}

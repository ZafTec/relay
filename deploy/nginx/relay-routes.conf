# Include this fragment inside the existing relay.zaftech.co TLS server block.
# The Nginx service must join RELAY_EDGE_NETWORK. Fixed upstream aliases are
# resolved through Docker DNS at request time, including during first deploy.
access_log /var/log/nginx/access.log relay_uri_only;

# Resolve fixed upstream aliases at request time through Docker's embedded DNS.
# Using variables keeps `nginx -t` bootstrap-safe before Relay containers exist;
# the values are static configuration, never derived from request input.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 2s;
set $relay_api_upstream relay-api:8000;
set $relay_web_upstream relay-web:8080;

location = /.well-known/oauth-authorization-server/api/auth {
  include /etc/nginx/snippets/relay-proxy-headers.conf;
  proxy_pass http://$relay_api_upstream;
}

location = /.well-known/openid-configuration/api/auth {
  include /etc/nginx/snippets/relay-proxy-headers.conf;
  proxy_pass http://$relay_api_upstream;
}

location = /.well-known/oauth-protected-resource {
  include /etc/nginx/snippets/relay-proxy-headers.conf;
  proxy_pass http://$relay_api_upstream;
}

location = /.well-known/oauth-protected-resource/mcp {
  include /etc/nginx/snippets/relay-proxy-headers.conf;
  proxy_pass http://$relay_api_upstream;
}

# Do not route ACME or unapproved well-known resources to Relay.
location ^~ /.well-known/ {
  return 404;
}

location = /mcp {
  include /etc/nginx/snippets/relay-proxy-headers.conf;
  proxy_set_header MCP-Protocol-Version $http_mcp_protocol_version;
  proxy_set_header Last-Event-ID $http_last_event_id;
  proxy_buffering off;
  proxy_cache off;
  gzip off;
  proxy_read_timeout 5m;
  proxy_send_timeout 30s;
  send_timeout 30s;
  proxy_next_upstream off;
  proxy_pass http://$relay_api_upstream;
}

# Relay intentionally treats the slash-suffixed MCP path as a distinct request.
location = /mcp/ {
  include /etc/nginx/snippets/relay-proxy-headers.conf;
  proxy_set_header MCP-Protocol-Version $http_mcp_protocol_version;
  proxy_set_header Last-Event-ID $http_last_event_id;
  proxy_buffering off;
  proxy_cache off;
  gzip off;
  proxy_read_timeout 5m;
  proxy_send_timeout 30s;
  send_timeout 30s;
  proxy_next_upstream off;
  proxy_pass http://$relay_api_upstream;
}

location = /api/v1/events {
  include /etc/nginx/snippets/relay-proxy-headers.conf;
  proxy_set_header Last-Event-ID $http_last_event_id;
  proxy_buffering off;
  proxy_cache off;
  gzip off;
  proxy_read_timeout 5m;
  proxy_send_timeout 30s;
  send_timeout 30s;
  proxy_next_upstream off;
  proxy_pass http://$relay_api_upstream;
}

location ^~ /api/ {
  include /etc/nginx/snippets/relay-proxy-headers.conf;
  proxy_pass http://$relay_api_upstream;
}

# Share tokens are bearer credentials embedded in the path. Do not write these
# requests to any inherited access log, and prevent browsers from propagating
# the token-bearing URL as a Referer after the response.
location ^~ /s/ {
  access_log off;
  include /etc/nginx/snippets/relay-proxy-headers.conf;
  proxy_hide_header Referrer-Policy;
  add_header Referrer-Policy "no-referrer" always;
  proxy_pass http://$relay_api_upstream;
}

location = /health/ready {
  include /etc/nginx/snippets/relay-proxy-headers.conf;
  proxy_pass http://$relay_api_upstream;
}

location = /version {
  include /etc/nginx/snippets/relay-proxy-headers.conf;
  proxy_pass http://$relay_api_upstream;
}

# Liveness is container-internal. Do not expose it merely because readiness is
# used by the public status page.
location = /health/live {
  return 404;
}

location / {
  include /etc/nginx/snippets/relay-proxy-headers.conf;
  proxy_pass http://$relay_web_upstream;
}

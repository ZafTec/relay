# Include from the Nginx `http` context before relay-routes.conf. `$uri` omits
# query strings. Referer is deliberately replaced with a literal dash because it
# can contain a share-token URL; /s/:token access logging is disabled separately.
log_format relay_uri_only '$remote_addr - $remote_user [$time_local] '
                          '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                          '"-" "$http_user_agent"';

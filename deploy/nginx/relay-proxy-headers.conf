# Install as /etc/nginx/snippets/relay-proxy-headers.conf and include it only
# from Relay proxy locations. `$remote_addr` must already be normalized by the
# host's allowlisted Cloudflare `real_ip` policy when Cloudflare fronts origin.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header Authorization $http_authorization;
proxy_set_header Origin $http_origin;
# Referer can carry /s/:token URLs. Relay does not consume it, so never forward
# the caller-controlled value into application logs or telemetry.
proxy_set_header Referer "";
proxy_set_header Connection "";

# Public callers cannot choose trace context until an explicit trusted
# propagation policy is approved.
proxy_set_header traceparent "";
proxy_set_header tracestate "";
proxy_set_header baggage "";

# Install as /opt/nginx/conf.d/relay.conf in the existing Nginx deployment.
# Web, API and MCP share this origin; signed files use storage.zaftech.co.
log_format relay_uri_only '$remote_addr [$time_local] "$request_method $uri" '
                          '$status $body_bytes_sent';

server {
    listen 80;
    listen [::]:80;
    server_name relay.zaftech.co;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /webroot;
        try_files $uri =404;
        default_type text/plain;
    }
    location / { return 301 https://relay.zaftech.co$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name relay.zaftech.co;
    ssl_certificate /etc/letsencrypt/live/relay.zaftech.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.zaftech.co/privkey.pem;
    client_max_body_size 50M;
    access_log /var/log/nginx/access.log relay_uri_only;
    # Nginx error messages contain raw query strings, OAuth codes and signed URLs.
    # Access status codes and the application's sanitized telemetry cover errors.
    error_log /dev/null;

    # https://www.cloudflare.com/ips-v4 and /ips-v6, checked 2026-09-06.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;
    set $relay_api_upstream relay-api:8000;
    set $relay_web_upstream relay-web:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Referer "";
    proxy_set_header Connection "";
    proxy_set_header traceparent "";
    proxy_set_header tracestate "";
    proxy_set_header baggage "";
    # Authorization, Origin, Last-Event-ID and MCP-Protocol-Version pass through.

    location ~ ^/\.well-known/(oauth-authorization-server/api/auth|openid-configuration/api/auth|oauth-protected-resource(/mcp)?)$ {
        proxy_pass http://$relay_api_upstream;
    }
    location /.well-known/ { return 404; }

    # Streaming responses need immediate delivery and a longer idle timeout.
    location ~ ^/(mcp/?|api/v1/events)$ {
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 5m;
        proxy_send_timeout 30s;
        send_timeout 30s;
        proxy_next_upstream off;
        proxy_pass http://$relay_api_upstream;
    }
    location /api/ { proxy_pass http://$relay_api_upstream; }
    location = /api { proxy_pass http://$relay_api_upstream; }
    location ^~ /s/ {
        access_log off;
        proxy_hide_header Referrer-Policy;
        add_header Referrer-Policy "no-referrer" always;
        proxy_pass http://$relay_api_upstream;
    }
    location = /health/ready { proxy_pass http://$relay_api_upstream; }
    location = /version { proxy_pass http://$relay_api_upstream; }
    location /health/ { return 404; }
    location / { proxy_pass http://$relay_web_upstream; }
}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 976 320" width="976" height="320" fill="none" role="img"><title>Usage moves from a pre-run estimate to a held reservation, provider use during attempts, and a settled usage receipt, with a release path for early failure</title><rect width="976" height="320" fill="#F5F4ED"></rect><text x="24" y="36" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="13" font-weight="700" letter-spacing="0.16em" fill="#141A16" text-anchor="start">METER PATH</text><rect x="24" y="74" width="196" height="140" fill="#F5F4ED" stroke="#46514B" stroke-width="1"></rect><path d="M24 74.5H220" stroke="#141A16" stroke-width="3"></path><text x="40" y="106" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="13" font-weight="700" letter-spacing="0.1em" fill="#141A16" text-anchor="start">ESTIMATE</text><text x="40" y="128" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="400" letter-spacing="0.04em" fill="#7A8C84" text-anchor="start">pre-run range</text><path d="M220 144H252" stroke="#1F776E" stroke-width="2"></path><rect x="232.5" y="140.5" width="7" height="7" fill="#1F776E"></rect><rect x="252" y="74" width="196" height="140" fill="#F5F4ED" stroke="#46514B" stroke-width="1"></rect><path d="M252 74.5H448" stroke="#141A16" stroke-width="3"></path><text x="268" y="106" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="13" font-weight="700" letter-spacing="0.1em" fill="#141A16" text-anchor="start">RESERVE</text><text x="268" y="128" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="400" letter-spacing="0.04em" fill="#7A8C84" text-anchor="start">capacity held</text><path d="M448 144H480" stroke="#1F776E" stroke-width="2"></path><rect x="460.5" y="140.5" width="7" height="7" fill="#1F776E"></rect><rect x="480" y="74" width="196" height="140" fill="#F5F4ED" stroke="#46514B" stroke-width="1"></rect><path d="M480 74.5H676" stroke="#141A16" stroke-width="3"></path><text x="496" y="106" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="13" font-weight="700" letter-spacing="0.1em" fill="#141A16" text-anchor="start">PROVIDER USE</text><text x="496" y="128" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="400" letter-spacing="0.04em" fill="#7A8C84" text-anchor="start">attempt runs</text><path d="M676 144H708" stroke="#1F776E" stroke-width="2"></path><rect x="688.5" y="140.5" width="7" height="7" fill="#1F776E"></rect><rect x="708" y="74" width="196" height="140" fill="#E9E7DC" stroke="#46514B" stroke-width="1"></rect><path d="M708 74.5H904" stroke="#1F776E" stroke-width="3"></path><text x="724" y="106" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="13" font-weight="700" letter-spacing="0.1em" fill="#141A16" text-anchor="start">SETTLE</text><text x="724" y="128" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="400" letter-spacing="0.04em" fill="#7A8C84" text-anchor="start">usage receipt</text><path d="M700 214V240H820" stroke="#46514B" stroke-width="1" stroke-dasharray="4 4"></path><rect x="820" y="214" width="132" height="60" fill="#F5F4ED" stroke="#46514B" stroke-width="1"></rect><text x="836" y="240" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" letter-spacing="0.08em" fill="#141A16" text-anchor="start">RELEASE</text><text x="836" y="260" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="400" letter-spacing="0.04em" fill="#7A8C84" text-anchor="start">run failed early</text><text x="24" y="300" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="400" letter-spacing="0.12em" fill="#46514B" text-anchor="start">RESERVATION IS RELEASED IN FULL WHEN A RUN FAILS BEFORE PROVIDER SUBMISSION</text></svg>
idth="3" height="40" fill="#141A16"></rect><text x="296" y="150" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="400" letter-spacing="0.02em" fill="#141A16" text-anchor="start">relay.commit_version</text><text x="690" y="150" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="400" letter-spacing="0.02em" fill="#7A8C84" text-anchor="end">→ asset_id, v3</text><path d="M214 144H280" stroke="#7A8C84" stroke-width="1"></path><rect x="280" y="172" width="420" height="40" fill="#F5F4ED" stroke="#46514B" stroke-width="1"></rect><rect x="280" y="172" width="3" height="40" fill="#141A16"></rect><text x="296" y="198" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="400" letter-spacing="0.02em" fill="#141A16" text-anchor="start">relay.enqueue_job</text><text x="690" y="198" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="400" letter-spacing="0.02em" fill="#7A8C84" text-anchor="end">→ job_id, QUEUED</text><path d="M214 192H280" stroke="#7A8C84" stroke-width="1"></path><rect x="280" y="220" width="420" height="40" fill="#F5F4ED" stroke="#46514B" stroke-width="1"></rect><rect x="280" y="220" width="3" height="40" fill="#1F776E"></rect><text x="296" y="246" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="400" letter-spacing="0.02em" fill="#141A16" text-anchor="start">relay.get_job</text><text x="690" y="246" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="400" letter-spacing="0.02em" fill="#7A8C84" text-anchor="end">→ RUNNING 3/5</text><path d="M214 240H280" stroke="#7A8C84" stroke-width="1"></path><rect x="280" y="268" width="420" height="40" fill="#F5F4ED" stroke="#46514B" stroke-width="1"></rect><rect x="280" y="268" width="3" height="40" fill="#1F776E"></rect><text x="296" y="294" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="400" letter-spacing="0.02em" fill="#141A16" text-anchor="start">relay.create_download_url</text><text x="690" y="294" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="400" letter-spacing="0.02em" fill="#7A8C84" text-anchor="end">→ signed url</text><path d="M214 288H280" stroke="#7A8C84" stroke-width="1"></path><rect x="766" y="76" width="134" height="240" fill="#F5F4ED" stroke="#46514B" stroke-width="1"></rect><text x="782" y="108" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="13" font-weight="700" letter-spacing="0.1em" fill="#141A16" text-anchor="start">RELAY</text><text x="782" y="130" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="400" letter-spacing="0.04em" fill="#7A8C84" text-anchor="start">workspace-</text><text x="782" y="148" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="400" letter-spacing="0.04em" fill="#7A8C84" text-anchor="start">scoped</text><path d="M700 196H766" stroke="#1F776E" stroke-width="2"></path><rect x="729.5" y="192.5" width="7" height="7" fill="#1F776E"></rect><text x="24" y="344" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="400" letter-spacing="0.12em" fill="#46514B" text-anchor="start">TOOL NAMES ILLUSTRATIVE · EVERY CALL IS SCOPED TO ONE WORKSPACE</text></svg>
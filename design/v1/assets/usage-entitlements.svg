<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 924 338" width="924" height="338" fill="none" role="img"><title>Usage meters for stored bytes, job minutes and egress with within-limit, approaching and at-limit states</title><rect width="924" height="338" fill="#F5F4ED"></rect><text x="24" y="36" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="13" font-weight="700" letter-spacing="0.16em" fill="#141A16" text-anchor="start">USAGE AND ENTITLEMENTS</text><text x="900" y="36" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="400" letter-spacing="0.12em" fill="#7A8C84" text-anchor="end">PREVIEW · NOT YET SHIPPED</text><text x="24" y="94" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" letter-spacing="0.1em" fill="#141A16" text-anchor="start">STORED BYTES</text><text x="24" y="116" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="400" letter-spacing="0.04em" fill="#7A8C84" text-anchor="start">41.2 GB / 100 GB</text><rect x="220" y="80" width="500" height="26" fill="#E9E7DC" stroke="#C9C7BA" stroke-width="1"></rect><rect x="220" y="80" width="205" height="26" fill="#1F776E"></rect><text x="900" y="98" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="400" letter-spacing="0.12em" fill="#46514B" text-anchor="end">WITHIN LIMIT</text><path d="M24 132H900" stroke="#C9C7BA" stroke-width="1"></path><text x="24" y="170" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" letter-spacing="0.1em" fill="#141A16" text-anchor="start">JOB MINUTES</text><text x="24" y="192" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="400" letter-spacing="0.04em" fill="#7A8C84" text-anchor="start">1 820 / 2 000</text><rect x="220" y="156" width="500" height="26" fill="#E9E7DC" stroke="#C9C7BA" stroke-width="1"></rect><rect x="220" y="156" width="455" height="26" fill="#1F776E"></rect><text x="900" y="174" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="400" letter-spacing="0.12em" fill="#46514B" text-anchor="end">APPROACHING</text><path d="M24 208H900" stroke="#C9C7BA" stroke-width="1"></path><text x="24" y="246" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" letter-spacing="0.1em" fill="#141A16" text-anchor="start">EGRESS</text><text x="24" y="268" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="400" letter-spacing="0.04em" fill="#7A8C84" text-anchor="start">512 GB / 512 GB</text><rect x="220" y="232" width="500" height="26" fill="#E9E7DC" stroke="#C9C7BA" stroke-width="1"></rect><rect x="220" y="232" width="500" height="26" fill="#141A16"></rect><text x="230" y="250" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700" letter-spacing="0.12em" fill="#F5F4ED" text-anchor="start">BLOCKED</text><text x="900" y="250" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700" letter-spacing="0.12em" fill="#141A16" text-anchor="end">AT LIMIT</text><text x="24" y="318" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="400" letter-spacing="0.12em" fill="#46514B" text-anchor="start">AT LIMIT: NEW JOBS AND UPLOADS ARE REJECTED WITH A TYPED ERROR · READS AND DOWNLOADS CONTINUE</text></svg>
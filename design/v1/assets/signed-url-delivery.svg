<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 924 334" width="924" height="334" fill="none" role="img"><title>Client requests a signed URL from Relay then transfers bytes directly with the object store</title><rect width="924" height="334" fill="#F5F4ED"></rect><text x="24" y="36" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="13" font-weight="700" letter-spacing="0.16em" fill="#141A16" text-anchor="start">SIGNED URL DELIVERY</text><rect x="24" y="76" width="200" height="80" fill="#F5F4ED" stroke="#46514B" stroke-width="1"></rect><text x="40" y="110" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="13" font-weight="700" letter-spacing="0.1em" fill="#141A16" text-anchor="start">MCP CLIENT</text><text x="40" y="132" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="400" letter-spacing="0.04em" fill="#7A8C84" text-anchor="start">holds no keys</text><rect x="362" y="76" width="200" height="80" fill="#E9E7DC" stroke="#46514B" stroke-width="1"></rect><path d="M362 77.5H562" stroke="#1F776E" stroke-width="3"></path><text x="378" y="112" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="13" font-weight="700" letter-spacing="0.1em" fill="#141A16" text-anchor="start">RELAY API</text><text x="378" y="134" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="400" letter-spacing="0.04em" fill="#7A8C84" text-anchor="start">signs, records</text><rect x="700" y="196" width="200" height="80" fill="#F5F4ED" stroke="#46514B" stroke-width="1"></rect><text x="716" y="230" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="13" font-weight="700" letter-spacing="0.1em" fill="#141A16" text-anchor="start">OBJECT STORE</text><text x="716" y="252" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="400" letter-spacing="0.04em" fill="#7A8C84" text-anchor="start">S3-compatible</text><path d="M224 106H362" stroke="#1F776E" stroke-width="2"></path><text x="293" y="96" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="400" letter-spacing="0.12em" fill="#7A8C84" text-anchor="middle">1 REQUEST URL</text><path d="M362 132H224" stroke="#1F776E" stroke-width="2"></path><text x="293" y="150" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="400" letter-spacing="0.12em" fill="#7A8C84" text-anchor="middle">2 SIGNED URL</text><path d="M124 156V236H700" stroke="#141A16" stroke-width="4"></path><text x="392" y="226" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700" letter-spacing="0.12em" fill="#141A16" text-anchor="start">3 BYTES · DIRECT PUT / GET</text><path d="M462 156V196" stroke="#7A8C84" stroke-width="1" stroke-dasharray="4 4"></path><text x="474" y="180" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="400" letter-spacing="0.12em" fill="#7A8C84" text-anchor="start">metadata only</text><text x="24" y="314" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="400" letter-spacing="0.12em" fill="#46514B" text-anchor="start">CONTROL PLANE THIN · DATA PLANE THICK · FILE BYTES NEVER TRANSIT THE APPLICATION</text></svg>
name: Dependency update report

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: dependency-update-report
  cancel-in-progress: false

jobs:
  report:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.4
      - name: Update dependency review issue
        run: >-
          deno run
          --allow-read=apps/web/package.json,.github/workflows
          --allow-env=GITHUB_REPOSITORY,GH_TOKEN
          --allow-net=api.github.com,registry.npmjs.org
          scripts/dependencies/report.ts --publish
        env:
          GH_TOKEN: ${{ github.token }}
